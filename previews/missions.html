<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>和の国の五つのミッション｜PATERIAL Lite</title>
  <style>
    :root { --pigment: #81715b; color-scheme: light; color: #282721; background: #eee3cb; font: 16px/1.55 system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(1040px, 100%); margin: auto; padding: clamp(14px, 4vw, 40px); }
    header { border-block: 3px double #81715b; padding: 12px 0 18px; }
    h1, h2 { font-family: "Yu Mincho", serif; margin: 0; }
    h1 { font-size: clamp(1.55rem, 4.2vw, 2.6rem); }
    header p { margin: 0 0 4px; font-size: .8rem; letter-spacing: .12em; }
    nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    nav a, button { min-width: 44px; min-height: 44px; padding: 8px 12px; border: 1px solid #8f806a; background: #fff6e0; color: inherit; font: inherit; text-align: center; }
    nav a { line-height: 26px; text-decoration: none; }
    nav a:hover, button:hover { background: #f5dca9; }
    button { cursor: pointer; }
    section { margin-top: 24px; padding: clamp(12px, 3vw, 24px); background: #faf1dc; border: 1px solid #a49378; border-top: 5px solid var(--pigment); }
    h2 { margin-bottom: 14px; }
    .layout { display: grid; grid-template-columns: minmax(0, 336px) minmax(0, 1fr); gap: 18px; align-items: start; }
    h3 { margin: 0 0 6px; font-size: .84rem; }
    .rack { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    figure { margin: 0; text-align: center; }
    .tile { width: 88px; padding: 4px; border: 1px solid #d1bc9a; background: #e9dcc0; }
    .pair { display: flex; gap: 4px; }
    .wide { width: 144px; max-width: 100%; }
    .tile.wide canvas { height: 124px; }
    .background + .background { margin-top: 16px; }
    .night .tile { background: #35435b; border-color: #6f7890; color: #fff0ce; }
    .tile canvas { display: block; width: 100%; height: 72px; object-fit: scale-down; }
    .spot canvas { width: 100%; object-fit: contain; }
    .background canvas { display: block; width: 100%; height: auto; }
    figcaption { font-size: .75rem; padding: 4px 0 0; }
    @media (max-width: 670px) { .layout { grid-template-columns: minmax(0, 1fr); } .background { max-width: 336px; } }
  </style>
</head>
<body>
<main>
  <header><p>PATERIAL Lite</p><h1>和の国の五つのミッション</h1></header>
  <nav aria-label="ミッション一覧"></nav>
  <button id="motion" type="button" hidden>動きを止める</button>
  <p id="status" role="status">絵を準備しています。</p>
  <section id="pictures"><h2>依代の祠の丸札</h2></section>
  <section id="rings"><h2>拍の予告</h2></section>
  <div id="missions"></div>
</main>
<div id="engine" hidden></div>
<script type="module" src="./missions.ts"></script>
</body>
</html>
