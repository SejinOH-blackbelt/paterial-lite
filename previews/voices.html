<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パテの声｜PATERIAL Lite</title>
  <style>
    :root { color-scheme: light; color: #282721; background: #eee3cb; font: 16px/1.55 system-ui, sans-serif; }
    body { margin: 0; }
    main { width: min(720px, 100%); margin: auto; padding: 16px; box-sizing: border-box; }
    h1 { font-family: "Yu Mincho", serif; font-size: 1.6rem; margin: 8px 0; }
    section { margin-top: 18px; padding: 14px; background: #faf1dc; border: 1px solid #a49378; border-top: 5px solid #81715b; }
    h2 { font-size: 1.05rem; margin: 0 0 8px; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; }
    button { min-height: 44px; padding: 8px 12px; border: 1px solid #8f806a; background: #fff6e0; color: inherit; font: inherit; cursor: pointer; }
    button:hover { background: #f5dca9; }
    .spy { border-color: #8a3a2a; }
    p { margin: 6px 0; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <h1>パテの声（聞きくらべ）</h1>
    <p>開発用のページです（公開ページには入りません）。ボタンを押すと鳴ります。</p>
    <section>
      <h2>王様の声（試合ごとに、どれか1つ）</h2>
      <p>なりすましたスパイは、その試合の本物とは別のパターンで話す。はじめの「ドン！」と聞きくらべるしか見分けられない。</p>
      <div id="kings"></div>
    </section>
    <section>
      <h2>あいさつの「ぺこっ」</h2>
      <p>市民もスパイも同じ声（声ではばれない）。</p>
      <div class="row">
        <button data-greet="1">ぺこっ</button>
      </div>
    </section>
  </main>
  <script type="module" src="./voices.ts"></script>
</body>
</html>
