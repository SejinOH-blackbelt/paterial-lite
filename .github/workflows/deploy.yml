# main に送るたびに、テストとビルドをして GitHub Pages に公開する。
# テストが1つでも失敗したら、公開しない（壊れたものを友達に渡さないため）。
name: 公開（GitHub Pages）

on:
  push:
    branches: [main]
  workflow_dispatch: # GitHub の画面の「Run workflow」からも手動で公開できる

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重なったら、新しいほうを優先する（ブランチごとに分けて、ほかのブランチの手動実行で main の公開が取り消されないように）
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 手動実行で main 以外のブランチを選んでも、公開しない
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
